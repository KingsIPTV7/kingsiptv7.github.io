<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Priyanshi 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6ec4,#7873f5);
}

.bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    animation:float 10s infinite linear;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0);
    }
    to{
        transform:translateY(-120px) scale(1);
    }
}

.card{
    width:90%;
    max-width:500px;
    text-align:center;
    padding:35px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    z-index:10;
}

h1{
    font-size:2.4rem;
    margin-bottom:10px;
}

.name{
    color:#fff7b2;
}

.cake{
    font-size:70px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-12px);
    }
}

.message{
    margin-top:15px;
    font-size:1.1rem;
    line-height:1.8;
}

.btn{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4da6;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    transform:scale(1.05);
}

.popup{
    display:none;
    margin-top:20px;
    font-size:1.2rem;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday <span class="name">Priyanshi</span> 💖</h1>

    <p class="message">
        Wishing you lots of happiness, success,
        laughter and beautiful memories.
        May your day be filled with smiles and joy. ✨🎉
    </p>

    <button class="btn" onclick="showWish()">
        Open Surprise 🎁
    </button>

    <div class="popup" id="wish">
        💞 Stay happy, keep smiling and enjoy your special day! 🎂✨
    </div>
</div>

<script>
function showWish(){
    document.getElementById("wish").style.display="block";
}

for(let i=0;i<30;i++){
    let c=document.createElement("div");
    c.classList.add("circle");

    let size=Math.random()*80+20;

    c.style.width=size+"px";
    c.style.height=size+"px";
    c.style.left=Math.random()*100+"%";
    c.style.animationDuration=(Math.random()*10+8)+"s";

    document.getElementById("bg").appendChild(c);
}
</script>

</body>
</html>
